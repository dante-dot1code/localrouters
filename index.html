    <script type="text/babel">
      const { useState, useEffect } = React;

      // ====== БАЗА ДАННЫХ ДЛЯ ДЕМО-РЕЖИМА ======
      const routeDatabase = {
        "Ростов-на-Дону": {
          history: {
            free: { title: "Тайны купеческого Ростова", distance: "2.5 км", points: [{ emoji: "🏛️", name: "Старый базар", desc: "Сердце старого города, атмосфера 19 века" }, { emoji: "🏰", name: "Особняк Петровой", desc: "Великолепная архитектура снаружи (бесплатный осмотр)" }, { emoji: "🌊", name: "Набережная Дона", desc: "Прогулка к речному вокзалу" }], tip: "Начинайте с утра: на Большой Садовой будет меньше людей, а свет для фото особняка лучше до 11:00." },
            medium: { title: "Ростов с вкусом и историей", distance: "3.0 км", points: [{ emoji: "🏛️", name: "Старый базар", desc: "Экскурсия по историческим улочкам" }, { emoji: "☕", name: "Кофейня «Пятая авеню»", desc: "Авторский раф и тихий дворик" }, { emoji: "🏰", name: "Особняк Петровой", desc: "Билет с аудиогидом по парадным залам" }, { emoji: "🌊", name: "Набережная Дона", desc: "Закат у реки" }], tip: "Билет с аудиогидом в особняк Петровой лучше брать онлайн, это сэкономит 15 минут в очереди." },
            premium: { title: "VIP-прогулка по донской столице", distance: "2.0 км", points: [{ emoji: "🥂", name: "Завтрак в «Империи»", desc: "Панорамный вид на город и авторская кухня" }, { emoji: "🚗", name: "Трансфер к Особняку Петровой", desc: "Индивидуальная экскурсия с историком" }, { emoji: "🍷", name: "Винный бар «Брюква»", desc: "Дегустация локальных вин и сыров" }], tip: "Мы зарезервировали для вас столик у окна. Подтвердите бронь за 2 часа до визита." }
          },
          food: {
            medium: { title: "Гастрономический Ростов", distance: "2.8 км", points: [{ emoji: "🥐", name: "Пекарня «Хлеб & Соль»", desc: "Свежие круассаны и донской джем" }, { emoji: "🥟", name: "Рынок «Темерник»", desc: "Дегустация фермерских сыров и раков" }, { emoji: "🍲", name: "Ресторан «Раки и Гады»", desc: "Легендарная донская уха" }], tip: "На рынке «Темерник» лучше всего пробовать сыры у продавцов в красных фартуках — это самые старые сыровары." }
          },
          photo: {
            free: { title: "Инстаграм-Ростов", distance: "3.5 км", points: [{ emoji: "🎨", name: "Стрит-арт на ул. Шаумяна", desc: "Самые яркие муралы города" }, { emoji: "🌉", name: "Зеленый остров", desc: "Мост и виды на центр с воды" }, { emoji: "🌅", name: "Смотровая у речного вокзала", desc: "Идеальный ракурс на закат" }], tip: "Свет на смотровой площадке лучший за 40 минут до заката, мы поставили эту точку именно на это время." }
          },
          nature: {
            free: { title: "Зеленый оазис Ростова", distance: "4.0 км", points: [{ emoji: "🌳", name: "Парк им. Горького", desc: "Тихие аллеи и пруд с лебедями" }, { emoji: "🌿", name: "Ботанический сад ЮФУ", desc: "Редкие растения и оранжерея" }], tip: "В Ботаническом саду в выходные много людей, будний день до 12:00 — идеальное время для тишины." }
          }
        },
        "Москва": {
          history: {
            medium: { title: "Тайны старой Москвы", distance: "3.0 км", points: [{ emoji: "🏰", name: "Зарядье", desc: "Парящий мост и виды на Кремль" }, { emoji: "☕", name: "Кафе «Дрифтер»", desc: "Спешелти кофе в историческом здании" }, { emoji: "🏛️", name: "Музей Москвы", desc: "Интерактивная история города" }], tip: "В Музей Москвы лучше приходить к открытию, чтобы спокойно сделать фото без толп." }
          },
          food: {
            premium: { title: "Гастрономический трип по центру", distance: "2.5 км", points: [{ emoji: "🥐", name: "Завтрак в «Кафе Пушкинъ»", desc: "Классическая русская кухня в интерьере дворца" }, { emoji: "🥗", name: "Прогулка по Патриаршим прудам", desc: "Модные бутики и атмосфера" }, { emoji: "🍷", name: "Ужин в «White Rabbit»", desc: "Панорамный вид и высокая кухня" }], tip: "Бронь в топовые места уже учтена в тайминге, но лучше подтвердить её за 2 часа." }
          },
          photo: {
            free: { title: "Открыточная Москва без толп", distance: "4.0 км", points: [{ emoji: "🏛️", name: "Дворы-колодцы Мясницкой", desc: "Скрытая архитектура и тишина" }, { emoji: "🌉", name: "Патриарший мост", desc: "Лучший вид на Храм Христа Спасителя" }, { emoji: "🌅", name: "Воробьевы горы", desc: "Классическая панорама Москвы" }], tip: "На Патриарший мост лучше подниматься со стороны метро Кропоткинская, там меньше всего людей." }
          },
          nature: {
            free: { title: "Москва парковая", distance: "3.5 км", points: [{ emoji: "🌳", name: "Аптекарский огород", desc: "Самый старый ботанический сад" }, { emoji: "🦆", name: "Екатерининский парк", desc: "Тихие пруды и уединенные беседки" }], tip: "В Аптекарском огороде сейчас цветут орхидеи, не пропустите оранжерею." }
          }
        },
        "Санкт-Петербург": {
          history: {
            medium: { title: "Имперский Петербург", distance: "3.2 км", points: [{ emoji: "🏛️", name: "Новая Голландия", desc: "Историческая реконструкция и уют" }, { emoji: "☕", name: "Кофейня «Север-Метр»", desc: "Лучший кофе в историческом центре" }, { emoji: "🏰", name: "Юсуповский дворец", desc: "Роскошные интерьеры и мистическая история" }], tip: "В Юсуповский дворец берите билет с аудиогидом, история убийства Распутина оживает с ним по-новому." }
          },
          food: {
            medium: { title: "Вкусы Петербурга", distance: "2.5 км", points: [{ emoji: "🥟", name: "Пышечная на Конюшенной", desc: "Легендарные пышки с советских времен" }, { emoji: "🐟", name: "Сенной рынок", desc: "Свежие морские деликатесы" }, { emoji: "🍰", name: "Кондитерская «Лакомка»", desc: "Торт «Ленинградский» по ГОСТу" }], tip: "В пышечную лучше идти до 11:00 или после 15:00, чтобы избежать огромных очередей." }
          },
          photo: {
            free: { title: "Фотогеничный Петербург", distance: "3.0 км", points: [{ emoji: "🎨", name: "Дворы-колодцы на Рубинштейна", desc: "Атмосфера старого Петербурга" }, { emoji: "🌉", name: "Смотровая у Исаакия", desc: "Легальный вид на колоннаду" }, { emoji: "🌅", name: "Стрелка Васильевского острова", desc: "Классический вид на закате" }], tip: "Свет для фото у Исаакия лучший за час до заката, мы поставили эту точку именно на это время." }
          },
          nature: {
            free: { title: "Зеленый Петербург", distance: "4.5 км", points: [{ emoji: "🌳", name: "Таврический сад", desc: "Спокойствие и красивые мостики" }, { emoji: "🌿", name: "Елагин остров", desc: "Просторные лужайки и вид на Финский залив" }], tip: "На Елагин остров можно взять напрокат велосипед, это ускорит прогулку и добавит эмоций." }
          }
        }
      };

      const getFallbackRoute = (city, interest, budget) => {
        return {
          title: `Персональный маршрут по г. ${city}`,
          distance: "2.5 - 3.5 км",
          points: [
            { emoji: "📍", name: "Центральная площадь", desc: "Отличная точка для начала и ориентации на местности" },
            { emoji: "☕", name: "Локальная кофейня", desc: "Место, где можно передохнуть и попробовать региональные десерты" },
            { emoji: "🏛️", name: "Скрытая архитектурная жемчужина", desc: "Место, о котором не пишут в обычных путеводителях" },
            { emoji: "🌅", name: "Смотровая площадка", desc: "Идеальное место для завершения прогулки и фотографий" }
          ],
          tip: `Для города ${city} мы рекомендуем начинать прогулку до 12:00, чтобы избежать основного потока туристов и насладиться атмосферой.`
        };
      };

      const problems = [
        { emoji: '🧩', title: 'Разрозненная информация', text: 'Блоги, карты, отзывы — всё в разных местах. Тратишь часы, собирая маршрут.' },
        { emoji: '⏰', title: 'Нехватка времени', text: 'Приехал на день-два — и не знаешь, как успеть главное без хаоса.' },
        { emoji: '☕', title: 'Нет точек отдыха', text: 'Гуляешь 3 часа без единого места, где можно нормально передохнуть.' },
        { emoji: '📸', title: 'Только «открыточные» места', text: 'Все ходят по одним и тем же точкам, а жемчужины города остаются в стороне.' },
      ];

      const steps = [
        {
          num: '01',
          emoji: '🎯',
          title: 'Задаёшь параметры',
          text: 'Время, бюджет, интересы, темп, с кем идёшь — всё за 30 секунд.',
        },
        {
          num: '02',
          emoji: '🗺️',
          title: 'Получаешь маршрут',
          text: 'Алгоритм строит оптимальный путь с точками еды, отдыха и скрытыми жемчужинами.',
        },
        {
          num: '03',
          emoji: '🚶',
          title: 'Идёшь и кайфуешь',
          text: 'Просто следуй маршруту. Никаких споров, никакого стресса — только удовольствие.',
        },
      ];

      const demoInterests = [
        { id: 'history', emoji: '🏛️', label: 'История' },
        { id: 'food', emoji: '🍔', label: 'Еда' },
        { id: 'photo', emoji: '📸', label: 'Фото' },
        { id: 'nature', emoji: '🌳', label: 'Природа' },
      ];

      const demoBudgets = [
        { id: 'free', label: 'Бесплатно', color: 'bg-green-100 text-green-700 border-green-200' },
        { id: 'medium', label: 'Средний', color: 'bg-blue-100 text-blue-700 border-blue-200' },
        { id: 'premium', label: 'Премиум', color: 'bg-amber-100 text-amber-700 border-amber-200' },
      ];

      const API_URL = 'https://localrouters.onrender.com';

      function App() {
        const [formData, setFormData] = useState({ name: '', contact: '', city: '', frequency: '' });
        const [errors, setErrors] = useState({});
        const [isSubmitted, setIsSubmitted] = useState(false);
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

        const [demoStep, setDemoStep] = useState('input');
        const [demoParams, setDemoParams] = useState({ city: 'Ростов-на-Дону', duration: '2 часа', interest: 'history', budget: 'medium' });
        const [loadingText, setLoadingText] = useState('Анализируем карту...');
        const [demoResult, setDemoResult] = useState(null);

        useEffect(() => {
          const handleClick = (e) => {
            const anchor = e.target.closest('a[href^="#"]');
            if (anchor) {
              e.preventDefault();
              const id = anchor.getAttribute('href')?.slice(1);
              if (id) {
                document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setMobileMenuOpen(false);
              }
            }
          };
          document.addEventListener('click', handleClick);
          return () => document.removeEventListener('click', handleClick);
        }, []);

        const startDemoGeneration = () => {
          setDemoStep('loading');
          const texts = [
            `Сканируем локации в г. ${demoParams.city}...`, 
            `Фильтруем по бюджету: ${demoBudgets.find(b => b.id === demoParams.budget)?.label}...`, 
            'Оптимизируем пешеходный путь...', 
            'Добавляем скрытые жемчужины...'
          ];
          let step = 0;
          const interval = setInterval(() => {
            setLoadingText(texts[step]);
            step++;
            if (step >= texts.length) clearInterval(interval);
          }, 700);

          setTimeout(() => {
            const cityData = routeDatabase[demoParams.city];
            let route = null;
            
            if (cityData && cityData[demoParams.interest] && cityData[demoParams.interest][demoParams.budget]) {
              route = cityData[demoParams.interest][demoParams.budget];
            } else if (cityData && cityData[demoParams.interest]) {
              route = cityData[demoParams.interest]['medium'] || Object.values(cityData[demoParams.interest])[0];
            } else {
              route = getFallbackRoute(demoParams.city, demoParams.interest, demoParams.budget);
            }

            let pointsToShow = route.points;
            if (demoParams.duration === '1 час') pointsToShow = route.points.slice(0, 2);
            else if (demoParams.duration === '2 часа') pointsToShow = route.points.slice(0, 3);
            
            const budgetMod = demoParams.budget === 'premium' ? ' (VIP-локации)' : demoParams.budget === 'free' ? ' (только бесплатные активности)' : '';

            setDemoResult({
              ...route,
              title: route.title + budgetMod,
              points: pointsToShow,
              saved: demoParams.budget === 'premium' ? 'максимум комфорта' : 'до 20% бюджета'
            });
            setDemoStep('result');

            // ====== ОТПРАВКА СТАТИСТИКИ ДЕМО НА BACKEND ======
            fetch(`${API_URL}/api/demo-stats`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                city: demoParams.city,
                duration: demoParams.duration,
                interest: demoParams.interest,
                budget: demoParams.budget,
              }),
            }).catch(err => console.log('Статистика демо не отправлена:', err));
          }, 2800);
        };

        const resetDemo = () => {
          setDemoStep('input');
          setDemoResult(null);
        };

        const validate = () => {
          const newErrors = {};
          if (!formData.name.trim()) newErrors.name = 'Укажите имя';
          if (!formData.contact.trim()) newErrors.contact = 'Укажите email или Telegram';
          if (!formData.city) newErrors.city = 'Выберите город';
          return newErrors;
        };

        // ====== ОТПРАВКА ЛИДА НА BACKEND ======
        const handleSubmit = async (e) => {
          e.preventDefault();
          const newErrors = validate();
          if (Object.keys(newErrors).length > 0) {
            setErrors(newErrors);
            return;
          }
          setErrors({});

          try {
            const response = await fetch(`${API_URL}/api/leads`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(formData),
            });

            if (!response.ok) {
              const err = await response.json();
              alert('Ошибка: ' + (err.error || 'Попробуйте позже'));
              return;
            }

            console.log('✅ Лид сохранён:', await response.json());
            setIsSubmitted(true);
          } catch (err) {
            console.error('Ошибка отправки:', err);
            // Если backend недоступен — всё равно показываем "спасибо"
            setIsSubmitted(true);
          }
        };

        const handleChange = (e) => {
          const { name, value } = e.target;
          setFormData(prev => ({ ...prev, [name]: value }));
          if (errors[name]) setErrors(prev => { const c = { ...prev }; delete c[name]; return c; });
        };

        return (
          <div className="min-h-screen bg-white font-sans text-gray-900">
            {/* НАВИГАЦИЯ */}
            <nav className="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-lg border-b border-gray-100">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex items-center justify-between h-16">
<a href="#hero" className="flex items-center gap-2.5 font-bold text-lg">
  <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="flex-shrink-0">
    <defs>
      <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#059669" />
        <stop offset="100%" stopColor="#14b8a6" />
      </linearGradient>
    </defs>
    {/* Круглый фон */}
    <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" />
    {/* Извилистая тропинка */}
    <path 
      d="M 25 75 Q 35 60, 50 55 T 75 35" 
      stroke="white" 
      strokeWidth="5" 
      strokeLinecap="round" 
      fill="none"
    />
    {/* Листик в начале тропы */}
    <path 
      d="M 20 78 Q 15 70, 22 68 Q 28 72, 25 78 Z" 
      fill="white"
    />
    {/* Точка-метка в конце */}
    <circle cx="75" cy="35" r="5" fill="white" />
    <circle cx="75" cy="35" r="2" fill="#059669" />
  </svg>
  <span className="bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">
